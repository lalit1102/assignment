<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
                * {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .profile-card {
            width: 350px;
            background: rgba(243, 237, 237, 0.984);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            
            box-sizing: border-box;
            border: 2px solid #e1e8ed;
        }
        .profile-header {
            text-align: center;
            padding: 30px 30px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            
            box-sizing: content-box;
            background-color: #f0f0f0;
            margin: 0 auto 20px;
            overflow: hidden;
        }
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .profile-name {
            font-size: 24px;
            font-weight: 700;
            color: #222;
            margin-bottom: 10px;
        }
        .profile-bio {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .profile-content {
            padding: 25px 30px;
        }
        .follow-btn {
            display: block;
            width: 94%;
            padding: 12px;
            background-color: #1da1f2;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
        
            box-sizing: content-box;
            border: 2px solid transparent;
        }
        .follow-btn:hover {
            background-color: #1991db;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            text-align: center;
        }
        .stat {
            padding: 10px;
        }
        .stat-value {
            font-weight: 700;
            font-size: 18px;
            color: #222;
        }
        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
        .box-model-sign {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            color: #888;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    </head>
<body>
    <div class="profile-card">
        <div class="box-model-sign">border-box</div>
        <div class="profile-header">
            <div class="profile-pic">
                <img src="215966637.jpg" alt="image" />
                <div class="box-model-sign">content-box</div>
            </div>
            <h1 class="profile-name">Lalit Baldaniya</h1>
            <p class="profile-bio">
                Full-Stack Developer | Passionate about React & Node.js
            </p>
        </div>
        <div class="profile-content">
            <div class="stats">
                <div class="stat">
                    <div class="stat-value">1.2K</div>
                    <div class="stat-label">Followers</div>
                </div>
                <div class="stat">
                    <div class="stat-value">328</div>
                    <div class="stat-label">Following</div>
                </div>
                <div class="stat">
                    <div class="stat-value">47</div>
                    <div class="stat-label">Posts</div>
                </div>
            </div>
            <button class="follow-btn">Follow</button>
        </div>
    </div>
</body>
</html>
